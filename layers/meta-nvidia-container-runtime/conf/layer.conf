BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-nvidia-container-runtime"
BBFILE_PATTERN_meta-nvidia-container-runtime = "^${LAYERDIR}/"
# Above meta-tegra (5) so this layer's bbappends apply on top of it.
BBFILE_PRIORITY_meta-nvidia-container-runtime = "10"

LAYERVERSION_meta-nvidia-container-runtime = "1"
LAYERDEPENDS_meta-nvidia-container-runtime = "core tegra"

LAYERSERIES_COMPAT_meta-nvidia-container-runtime = "wrynose"

# The base OS builds in the same bitbake configuration, so this layer must not
# change DISTRO_FEATURES. These recipes use opengl and virtualization only as a
# features_check gate, so lift the gate per recipe instead. None of them is in
# the base image. See docs/toolkit.md#distro_features.
REQUIRED_DISTRO_FEATURES:remove:pn-libglvnd = "opengl"
REQUIRED_DISTRO_FEATURES:remove:pn-l4t-nvidia-glheaders = "opengl"
REQUIRED_DISTRO_FEATURES:remove:pn-tegra-libraries-multimedia = "opengl"
REQUIRED_DISTRO_FEATURES:remove:pn-tegra-libraries-multimedia-utils = "opengl"
REQUIRED_DISTRO_FEATURES:remove:pn-tegra-libraries-camera = "opengl"
REQUIRED_DISTRO_FEATURES:remove:pn-tegra-argus-daemon = "opengl"
REQUIRED_DISTRO_FEATURES:remove:pn-nvidia-container-toolkit = "virtualization"
REQUIRED_DISTRO_FEATURES:remove:pn-libnvidia-container = "virtualization"

# Private Go toolchain for nvidia-container-toolkit, staged apart from the
# build's Go. See docs/toolkit.md#go-toolchain.
NVRUNTIME_GOROOT_DIR = "nvruntime-go"

# meta-tegra hides its NVIDIA container recipes behind a meta-virtualization
# check that balena device repos never satisfy, so name them explicitly. Two
# narrow globs, not one wide one. See docs/toolkit.md.
BBFILES += "${LAYERDIR}/../meta-tegra/external/virtualization-layer/recipes-containers/nvidia-container-toolkit/nvidia-container-toolkit_*.bb"
BBFILES += "${LAYERDIR}/../meta-tegra/external/virtualization-layer/recipes-containers/libnvidia-container/libnvidia-container_*.bb"
