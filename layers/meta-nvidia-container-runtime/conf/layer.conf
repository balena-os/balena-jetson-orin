BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-nvidia-container-runtime"
BBFILE_PATTERN_meta-nvidia-container-runtime = "^${LAYERDIR}/"
# Above meta-tegra (5) so this layer's bbappends apply on top of it.
BBFILE_PRIORITY_meta-nvidia-container-runtime = "10"

LAYERVERSION_meta-nvidia-container-runtime = "1"
LAYERDEPENDS_meta-nvidia-container-runtime = "core tegra"

LAYERSERIES_COMPAT_meta-nvidia-container-runtime = "wrynose"

# Required by the meta-tegra recipes this layer installs: virtualization by the
# toolkit, opengl by the camera/multimedia libraries. This is also why the
# extension needs its own build config. See docs/toolkit.md#distro_features.
DISTRO_FEATURES:append = " virtualization opengl"

# meta-tegra hides its NVIDIA container recipes behind a meta-virtualization
# check that balena device repos never satisfy, so name them explicitly. Two
# narrow globs, not one wide one. See docs/toolkit.md.
BBFILES += "${LAYERDIR}/../meta-tegra/external/virtualization-layer/recipes-containers/nvidia-container-toolkit/nvidia-container-toolkit_*.bb"
BBFILES += "${LAYERDIR}/../meta-tegra/external/virtualization-layer/recipes-containers/libnvidia-container/libnvidia-container_*.bb"
